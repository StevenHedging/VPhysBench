[project]
name = "vphysbench"
version = "0.1.0"
description = "Train/evaluate integrated benchmark scaffold for physical video generation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
scene-evaluation = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "scipy>=1.11",
  "torch>=2.5",
]
# Backward-compatible alias retained for existing pendulum-only environments.
pendulum-evaluation = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "torch>=2.5",
]
dataset-import = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "openpyxl>=3.1",
]

[project.scripts]
physbench = "physbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physbench = ["baseline_plugins/resources/*.json"]
