[project]
name = "vphysbench"
version = "0.1.0"
description = "Reproducible benchmark scaffold for physical video generation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
scene-evaluation = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",
  "scipy>=1.11",
  "torch>=2.5.1",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
sam31-evaluation = [
  "sam3 @ git+https://github.com/facebookresearch/sam3.git@8f0b7f4d4e7eda2ed606ebde6702c93359ad01da",
]
# Backward-compatible alias retained for existing pendulum-only environments.
pendulum-evaluation = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.5",
]
dataset-import = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "openpyxl>=3.1",
]
hub = [
  "huggingface_hub>=0.34",
]

[project.scripts]
physbench = "physbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physbench = ["baseline_plugins/resources/*.json"]
