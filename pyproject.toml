[project]
name = "physics-video-benchmark"
version = "0.1.0"
description = "Train/evaluate integrated benchmark scaffold for physical video generation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
physbench = "physbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

